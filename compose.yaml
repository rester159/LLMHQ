services:
  ollama:
    image: ollama/ollama:latest
    container_name: llmhq-ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ${LLMHQ_OLLAMA_DATA_DIR:-./data/ollama}:/root/.ollama
    networks:
      llmhq_private:
        aliases:
          - ollama

  embeddings:
    build: ./embeddings
    container_name: llmhq-embeddings
    restart: unless-stopped
    ports:
      - "${LLMHQ_EMBEDDINGS_HOST_BIND:-0.0.0.0}:${LLMHQ_EMBEDDINGS_HOST_PORT:-18090}:8080"
    environment:
      EMBEDDING_MODEL_ALIAS: "${LLMHQ_EMBEDDINGS_MODEL:-text-embedding-3-small}"
      EMBEDDING_MODEL: "${LLMHQ_EMBEDDINGS_NATIVE_MODEL:-BAAI/bge-small-en-v1.5}"
      EMBEDDING_CACHE_DIR: "/cache"
    volumes:
      - ${LLMHQ_EMBEDDINGS_CACHE_DIR:-./data/embeddings}:/cache
    networks:
      llmhq_private:
        aliases:
          - embeddings

  llmhq:
    build: .
    container_name: llmhq
    restart: unless-stopped
    depends_on:
      - ollama
      - embeddings
    ports:
      - "${LLMHQ_HOST_BIND:-127.0.0.1}:${LLMHQ_HOST_PORT:-18088}:8080"
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:18089]/admin"
    expose:
      - "8080"
      - "7900"
    environment:
      LLMHQ_HOST: "0.0.0.0"
      LLMHQ_PORT: "8080"
      LLMHQ_AUTH_MODE: "none"
      LLMHQ_ASSET_DIR: "/app/data/assets"
      LLMHQ_CONVERSATION_DIR: "/app/data/conversations"
      LLMHQ_WORKSPACE_DIR: "/app/data/workspaces"
      LLMHQ_WORKSPACE_PROVIDER_TOKENS: "${LLMHQ_WORKSPACE_PROVIDER_TOKENS:-}"
      LLMHQ_SETTINGS_FILE: "/app/data/settings.json"
      LLMHQ_DEFAULT_CHAT_MODEL: "claude-sonnet"
      LLMHQ_MAX_CONVERSATION_MESSAGES: "60"
      LLMHQ_WORKER_FAILURE_COOLDOWN_MS: "30000"
      LLMHQ_CLAUDE_ENABLED: "1"
      LLMHQ_CLAUDE_COMMAND: "claude"
      LLMHQ_CLAUDE_WORKERS: "claude-1=/app/data/profiles/claude-1"
      LLMHQ_CODEX_ENABLED: "1"
      LLMHQ_CODEX_COMMAND: "codex"
      LLMHQ_CODEX_WORKERS: "codex-1=/app/data/profiles/codex-1"
      LLMHQ_CODEX_WORKDIR: "/app/data/codex-workdir"
      LLMHQ_OLLAMA_ENABLED: "1"
      LLMHQ_OLLAMA_BASE_URL: "http://ollama:11434"
      LLMHQ_OLLAMA_WORKERS: "ollama-local=http://ollama:11434"
      LLMHQ_OLLAMA_DEFAULT_MODEL: "${LLMHQ_OLLAMA_DEFAULT_MODEL:-llama3.2}"
      LLMHQ_OLLAMA_CODER_MODEL: "${LLMHQ_OLLAMA_CODER_MODEL:-qwen2.5-coder:7b}"
      LLMHQ_OLLAMA_TIMEOUT_MS: "${LLMHQ_OLLAMA_TIMEOUT_MS:-180000}"
      LLMHQ_EMBEDDINGS_ENABLED: "${LLMHQ_EMBEDDINGS_ENABLED:-1}"
      LLMHQ_EMBEDDINGS_BASE_URL: "${LLMHQ_EMBEDDINGS_BASE_URL:-http://embeddings:8080}"
      LLMHQ_EMBEDDINGS_MODEL: "${LLMHQ_EMBEDDINGS_MODEL:-text-embedding-3-small}"
      LLMHQ_EMBEDDINGS_NATIVE_MODEL: "${LLMHQ_EMBEDDINGS_NATIVE_MODEL:-BAAI/bge-small-en-v1.5}"
      LLMHQ_EMBEDDINGS_TIMEOUT_MS: "${LLMHQ_EMBEDDINGS_TIMEOUT_MS:-180000}"
      LLMHQ_EXPERIMENTAL_CHATGPT_BROWSER: "1"
      LLMHQ_CHATGPT_PROFILE_DIR: "/app/data/browser-profiles/chatgpt-main"
      LLMHQ_CHATGPT_HEADLESS: "1"
      LLMHQ_CHATGPT_TIMEOUT_MS: "60000"
      LLMHQ_PROXY_TARGET: "${LLMHQ_PROXY_TARGET:-}"
    volumes:
      - ${LLMHQ_DATA_DIR:-./data}:/app/data
    networks:
      - llmhq_private

  webui:
    build: .
    container_name: llmhq-webui
    restart: unless-stopped
    depends_on:
      - llmhq
    command: ["node", "src/adminServer.js"]
    ports:
      - "${LLMHQ_WEBUI_BIND:-0.0.0.0}:${LLMHQ_WEBUI_PORT:-18089}:8090"
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:18089]/admin"
    environment:
      LLMHQ_ADMIN_HOST: "0.0.0.0"
      LLMHQ_ADMIN_PORT: "8090"
      LLMHQ_ADMIN_API_BASE_URL: "http://llmhq:8080"
    networks:
      - llmhq_private

  network-sync:
    image: docker:27-cli
    container_name: llmhq-network-sync
    restart: unless-stopped
    depends_on:
      - llmhq
    network_mode: "none"
    environment:
      LLMHQ_CONTAINER: "llmhq"
      LLMHQ_NETWORK_SYNC_EXCLUDE: "${LLMHQ_NETWORK_SYNC_EXCLUDE:-bridge host none llmhq_private}"
      LLMHQ_NETWORK_SYNC_INTERVAL_SECONDS: "${LLMHQ_NETWORK_SYNC_INTERVAL_SECONDS:-30}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/server-network-sync.sh:/usr/local/bin/llmhq-network-sync:ro
    command: ["sh", "/usr/local/bin/llmhq-network-sync"]

networks:
  llmhq_private:
    name: llmhq_private
    external: true
