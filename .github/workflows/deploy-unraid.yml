name: Deploy LLMHQ to Unraid

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: llmhq-unraid-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  LLMHQ_DEPLOY_PATH: ${{ vars.LLMHQ_DEPLOY_PATH || '/mnt/user/appdata/llmhq' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: verify
    runs-on: [self-hosted, llmhq-unraid]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='tmp' \
            -czf "/tmp/llmhq-${GITHUB_SHA}.tgz" .

      - name: Deploy on Unraid
        run: |
          set -euo pipefail
          base="${LLMHQ_DEPLOY_PATH}"
          source_next="${base}/source.next"
          data_dir="${base}/data"
          ollama_data_dir="${data_dir}/ollama"
          embeddings_cache_dir="${data_dir}/embeddings"

          mkdir -p "${data_dir}"
          if [ -e "${ollama_data_dir}" ] && [ ! -d "${ollama_data_dir}" ]; then
            moved_ollama_path="${ollama_data_dir}.broken-${GITHUB_RUN_ID:-$(date +%s)}"
            mv "${ollama_data_dir}" "${moved_ollama_path}"
            echo "Moved non-directory Ollama data path to ${moved_ollama_path}"
          fi
          mkdir -p "${ollama_data_dir}"
          mkdir -p "${embeddings_cache_dir}"
          rm -rf "${source_next}"
          mkdir -p "${source_next}"
          tar -xzf "/tmp/llmhq-${GITHUB_SHA}.tgz" -C "${source_next}"
          docker rm -f llmhq-network-sync llmhq-webui llmhq llmhq-embeddings llmhq-ollama >/dev/null 2>&1 || true
          if [ -f "${base}/source/compose.yaml" ]; then
            LLMHQ_DATA_DIR="${data_dir}" LLMHQ_OLLAMA_DATA_DIR="${ollama_data_dir}" LLMHQ_EMBEDDINGS_CACHE_DIR="${embeddings_cache_dir}" docker compose -p llmhq -f "${base}/source/compose.yaml" stop network-sync >/dev/null 2>&1 || true
            LLMHQ_DATA_DIR="${data_dir}" LLMHQ_OLLAMA_DATA_DIR="${ollama_data_dir}" LLMHQ_EMBEDDINGS_CACHE_DIR="${embeddings_cache_dir}" docker compose -p llmhq -f "${base}/source/compose.yaml" rm -f network-sync >/dev/null 2>&1 || true
          fi
          rm -rf "${base}/source"
          mv "${source_next}" "${base}/source"

          docker network create llmhq_private >/dev/null 2>&1 || true
          compose_env_args=()
          if [ -f "${base}/.env" ]; then
            compose_env_args=(--env-file "${base}/.env")
          fi
          LLMHQ_DATA_DIR="${data_dir}" LLMHQ_OLLAMA_DATA_DIR="${ollama_data_dir}" LLMHQ_EMBEDDINGS_CACHE_DIR="${embeddings_cache_dir}" docker compose "${compose_env_args[@]}" -p llmhq -f "${base}/source/compose.yaml" up -d --build ollama embeddings llmhq webui network-sync
          if ! docker exec llmhq sh -lc 'npm run ollama:pull -- "${LLMHQ_OLLAMA_DEFAULT_MODEL:-llama3.2}"'; then
            echo "Ollama pull failed; continuing to readiness probe in case the model is already installed."
          fi
          host_port="${LLMHQ_HOST_PORT:-18088}"
          webui_port="${LLMHQ_WEBUI_PORT:-18089}"
          embeddings_port="${LLMHQ_EMBEDDINGS_HOST_PORT:-18090}"
          host_probe_image="$(docker inspect -f '{{.Config.Image}}' llmhq)"
          for attempt in $(seq 1 30); do
            if docker exec llmhq node -e "fetch('http://127.0.0.1:8080/v1/models').then((r) => { if (!r.ok) process.exit(1); return r.text(); }).then((body) => console.log(body.slice(0, 500))).catch(() => process.exit(1))" \
              && docker exec llmhq node -e "fetch('http://127.0.0.1:8080/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model: 'ollama-llama3.2', fallback: 'none', max_tokens: 2, messages: [{ role: 'user', content: 'Reply ok.' }] }) }).then(async (r) => { const body = await r.text(); console.log(body.slice(0, 500)); if (!r.ok) process.exit(1); }).catch(() => process.exit(1))" \
              && docker exec llmhq node -e "fetch('http://embeddings:8080/health').then(async (r) => { const body = await r.text(); console.log(body.slice(0, 500)); if (!r.ok) process.exit(1); }).catch(() => process.exit(1))" \
              && docker exec llmhq node -e "fetch('http://127.0.0.1:8080/v1/embeddings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model: process.env.LLMHQ_EMBEDDINGS_MODEL || 'text-embedding-3-small', input: ['embedding readiness probe'] }) }).then(async (r) => { const body = await r.text(); console.log(body.slice(0, 500)); if (!r.ok) process.exit(1); const parsed = JSON.parse(body); if (!Array.isArray(parsed.data) || !Array.isArray(parsed.data[0]?.embedding)) process.exit(1); }).catch(() => process.exit(1))" \
              && docker run --rm --network host --entrypoint node "${host_probe_image}" -e "fetch('http://127.0.0.1:${host_port}/v1/models').then((r) => { if (!r.ok) process.exit(1); return r.text(); }).then((body) => console.log(body.slice(0, 500))).catch(() => process.exit(1))" \
              && docker run --rm --network host --entrypoint node "${host_probe_image}" -e "fetch('http://127.0.0.1:${embeddings_port}/health').then((r) => { if (!r.ok) process.exit(1); return r.text(); }).then((body) => console.log(body.slice(0, 500))).catch(() => process.exit(1))" \
              && docker run --rm --network host --entrypoint node "${host_probe_image}" -e "fetch('http://127.0.0.1:${webui_port}/admin').then((r) => { if (!r.ok) process.exit(1); return r.text(); }).then((body) => { if (!body.includes('LLMHQ Admin')) process.exit(1); console.log(body.slice(0, 120)); }).catch(() => process.exit(1))" \
              && docker run --rm --network host --entrypoint node "${host_probe_image}" -e "fetch('http://127.0.0.1:${webui_port}/v1/models').then((r) => { if (!r.ok) process.exit(1); return r.text(); }).then((body) => console.log(body.slice(0, 500))).catch(() => process.exit(1))" \
              && docker inspect -f '{{.State.Running}}' llmhq-network-sync | grep -q true; then
              echo "${GITHUB_SHA}" > "${base}/current.sha"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail=120 llmhq || true
          docker logs --tail=120 llmhq-embeddings || true
          exit 1
