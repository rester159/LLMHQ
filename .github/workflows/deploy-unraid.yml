name: Deploy LLMHQ to Unraid

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: llmhq-unraid-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  LLMHQ_DEPLOY_PATH: ${{ vars.LLMHQ_DEPLOY_PATH || '/mnt/user/appdata/llmhq' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: verify
    runs-on: [self-hosted, llmhq-unraid]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='tmp' \
            -czf "/tmp/llmhq-${GITHUB_SHA}.tgz" .

      - name: Deploy on Unraid
        run: |
          set -euo pipefail
          base="${LLMHQ_DEPLOY_PATH}"
          source_next="${base}/source.next"

          mkdir -p "${base}/data"
          rm -rf "${source_next}"
          mkdir -p "${source_next}"
          tar -xzf "/tmp/llmhq-${GITHUB_SHA}.tgz" -C "${source_next}"
          rm -rf "${base}/source"
          mv "${source_next}" "${base}/source"

          docker network create llmhq_private >/dev/null 2>&1 || true
          LLMHQ_DATA_DIR="${base}/data" docker compose -p llmhq -f "${base}/source/compose.yaml" up -d --build llmhq
          for attempt in $(seq 1 30); do
            if docker exec llmhq node -e "fetch('http://127.0.0.1:8080/v1/models').then((r) => { if (!r.ok) process.exit(1); return r.text(); }).then((body) => console.log(body.slice(0, 500))).catch(() => process.exit(1))"; then
              echo "${GITHUB_SHA}" > "${base}/current.sha"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail=120 llmhq || true
          exit 1
